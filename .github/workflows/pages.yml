name: Refresh and deploy dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1,5"
  push:
    branches: ["main"]
    paths:
      - "config/**"
      - "data/reported_metrics.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Refresh public sources
        run: python scripts/update_dashboard.py --project-root .

      - name: Build GitHub Pages and JSON APIs
        run: python scripts/build_github_pages.py --project-root .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
